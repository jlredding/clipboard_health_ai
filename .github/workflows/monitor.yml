name: staffing-monitor

# Runs the staffing monitor agent after the pipeline loads new data.
# Triggers:
#   - repository_dispatch "pipeline-loaded": sent by clipboard_health_pipeline's workflow after dbt build
#   - schedule: backup, 3 hours after the pipeline's monthly run
#   - manual
on:
  repository_dispatch:
    types: [pipeline-loaded]
  schedule:
    - cron: "17 14 5 * *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to review, e.g. 2026Q2 (blank = latest)"
        required: false
      open_issues:
        description: "Open GitHub issues for high-severity findings"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: APP_READER_SVC
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/app_reader_svc_key.p8
      SNOWFLAKE_ROLE: CLIPBOARD_READER
      SNOWFLAKE_WAREHOUSE: CLIPBOARD_WH
      SNOWFLAKE_DATABASE: CLIPBOARD_HEALTH
      SNOWFLAKE_SCHEMA: MARTS
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Write Snowflake private key from secret
        run: |
          printf '%s\n' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          chmod 600 "$SNOWFLAKE_PRIVATE_KEY_PATH"
      - name: Run the monitor agent
        run: |
          ARGS=""
          if [ -n "${{ inputs.quarter }}" ]; then ARGS="--quarter ${{ inputs.quarter }}"; fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.open_issues }}" = "true" ]; then
            ARGS="$ARGS --open-issues"
          fi
          python monitor.py $ARGS
      - name: Add the brief to the run summary
        if: always()
        run: cat reports/staffing_brief_*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staffing-brief
          path: reports/
